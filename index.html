<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1628" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      Framer Motion prerenders each entry animation's starting state as an inline
      style (opacity:0 plus a transform). Those only ever animate once JS runs, so
      without JS the page must be forced back to its resting state.
    -->
    <noscript>
      <style>
        #root [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <!--
      Everything between these markers is replaced per route by scripts/prerender.ts
      using src/data/seo.ts. What's here is the dev-server fallback only.
    -->
    <!--seo:start-->
    <title>EasyWays Credit Limited. Fast credit. Your way, anytime.</title>
    <meta
      name="description"
      content="CBK-licensed digital credit provider in Kenya. Logbook, emergency, virtual asset and phone purchase loans — disbursed to M-Pesa within minutes."
    />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
