# Serves the prerendered output of `npm run build`.
#
# The critical rule is `try_files` below: this site is NOT a single-page app at the
# server level. Every route has its own HTML file with its own <head>, so the usual
# SPA fallback (everything -> /index.html) would serve the home page's title,
# description and canonical on every URL and undo the prerendering.
#
# Note on headers: nginx's add_header is replace-not-merge. A location that sets any
# add_header drops every one inherited from the server block, so each location below
# that needs headers restates them via the shared include.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;

    # TLS is terminated by the reverse proxy in front of this container, so without
    # this every access log line would read as the Docker gateway address.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Route documents are extensionless (/products, not /products.html), so this
    # must live at server level to reach them — a `\.html$` location would miss.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;

    # Map a route to its prerendered file: /products -> /products/index.html.
    #
    # `$uri/` is deliberately absent: it makes nginx 301 to the trailing-slash form,
    # which costs a round trip and lands on a URL that disagrees with the page's own
    # rel=canonical. Going straight to $uri/index.html serves /products at /products.
    #
    # The fallback is `=404`, not `/404.html` — naming the file would serve the error
    # page with a 200, telling crawlers a dead URL is a real page.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Container health probe.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    server_tokens off;
}
